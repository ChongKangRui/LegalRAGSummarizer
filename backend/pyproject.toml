[project]
name = "RAGLegalSummarizer"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "chromadb>=1.5.9",
    "fastapi[standard]>=0.141.1",
    "fastembed>=0.8.0",
    "groq>=1.7.0",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.3",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.5",
]
experiments = [
    "chromadb>=1.5.9",
    "sentence-transformers>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
